<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Guard Admin</title>
    <script src="https://telegram.org/js/telegram-widget.js?22"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- LOGIN -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>🛡️ Rust Guard Admin</h1>
            <p>Войди через Telegram для доступа</p>
            <div id="tg-login-widget">
                <script async src="https://telegram.org/js/telegram-widget.js?22"
                        data-telegram-login="rustguard_official_bot"
                        data-size="large"
                        data-onauth="onTelegramAuth(user)"
                        data-request-access="write"></script>
            </div>
            <div id="login-error" class="login-error" style="display:none;"></div>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin-screen" class="screen" style="display:none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🛡️ Rust Guard</h2>
                <p id="admin-name">Admin</p>
            </div>
            <nav class="sidebar-nav">
                <button data-tab="dashboard" class="active">📊 Дашборд</button>
                <button data-tab="users">👥 Юзеры</button>
                <button data-tab="tickets">🎫 Тикеты</button>
                <button data-tab="logs">📜 Логи</button>
                <button data-tab="purchases">💰 Покупки</button>
                <button data-tab="broadcast">📨 Рассылка</button>
                <button data-tab="promos">🎟 Промокоды</button>
            </nav>
            <button id="logout-btn" class="logout-btn">🚪 Выйти</button>
        </aside>

        <main class="content">
            <div id="tab-dashboard" class="tab-content active">
                <h1>📊 Дашборд</h1>
                <div class="stats-grid" id="stats-grid">Загрузка...</div>
            </div>

            <div id="tab-users" class="tab-content">
                <h1>👥 Юзеры</h1>
                <div class="search-bar">
                    <input type="text" id="user-search" placeholder="ID, @username или имя..." onkeypress="if(event.key==='Enter') searchUsers()">
                    <button onclick="searchUsers()">🔍 Поиск</button>
                                        <button onclick="exportUsersCSV()" style="background:linear-gradient(135deg,#22c55e,#16a34a);">📥 CSV</button>
                </div>
                                    <div class="filter-row" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
                        <button class="filter-btn active" data-filter="all" onclick="filterUsers('all')">Все</button>
                        <button class="filter-btn" data-filter="premium" onclick="filterUsers('premium')">⭐ Премиум</button>
                        <button class="filter-btn" data-filter="helper" onclick="filterUsers('helper')">🎧 Хелперы</button>
                        <button class="filter-btn" data-filter="banned" onclick="filterUsers('banned')">🚫 Забанены</button>
                    </div>
                <div id="users-table" class="table-wrap">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>
            
            <div id="tab-tickets" class="tab-content">
                <h1>🎫 Тикеты</h1>
                <div id="tickets-table" class="table-wrap">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>

            <div id="tab-logs" class="tab-content">
                <h1>📜 Логи</h1>
                <div id="logs-table" class="table-wrap">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>

            <div id="tab-purchases" class="tab-content">
                <h1>💰 Покупки</h1>
                <div id="purchases-table" class="table-wrap">
                    <div class="loading">Скоро...</div>
                </div>
            </div>
                        <div id="tab-broadcast" class="tab-content">
                <h1>📨 Рассылка</h1>
                <div style="background:#16161d;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:20px;max-width:800px;">
                    <label style="display:block;font-size:12px;color:#7a7a8e;margin-bottom:6px;">Текст (HTML разрешён)</label>
                    <textarea id="broadcast-text" rows="8" style="width:100%;padding:12px;background:#0e0e12;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;font-family:inherit;font-size:14px;box-sizing:border-box;resize:vertical;"></textarea>
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button class="btn primary" onclick="sendBroadcast()">🚀 Отправить всем</button>
                        <button class="btn" onclick="previewBroadcast()">👁️ Превью</button>
                    </div>
                    <div id="broadcast-preview" style="margin-top:16px;padding:16px;background:#0e0e12;border-radius:10px;display:none;font-size:14px;line-height:1.5;"></div>
                    <div id="broadcast-result" style="margin-top:12px;font-size:13px;"></div>
                </div>
            </div>
                        <div id="tab-promos" class="tab-content">
                <h1>🎟 Промокоды</h1>
                <button class="btn primary" onclick="showPromoForm()" style="margin-bottom:16px;">➕ Создать промокод</button>

                <div id="promo-form" style="display:none;background:#16161d;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:20px;margin-bottom:16px;max-width:600px;">
                    <label style="display:block;font-size:12px;color:#7a7a8e;margin-bottom:6px;">Код</label>
                    <input type="text" id="p-code" placeholder="RUST30" style="width:100%;padding:12px;background:#0e0e12;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;">
                    
                    <label style="display:block;font-size:12px;color:#7a7a8e;margin-bottom:6px;">Тип</label>
                    <select id="p-type" style="width:100%;padding:12px;background:#0e0e12;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;">
                        <option value="premium">⭐ Дни премиума</option>
                        <option value="checks">🎮 Бонусные проверки</option>
                        <option value="discount">💰 Скидка %</option>
                    </select>
                    
                    <label style="display:block;font-size:12px;color:#7a7a8e;margin-bottom:6px;">Значение (30 / 10 / 50)</label>
                    <input type="number" id="p-value" placeholder="30" style="width:100%;padding:12px;background:#0e0e12;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;">
                    
                    <label style="display:block;font-size:12px;color:#7a7a8e;margin-bottom:6px;">Лимит использований (пусто = безлимит)</label>
                    <input type="number" id="p-maxuses" placeholder="100" style="width:100%;padding:12px;background:#0e0e12;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;">
                    
                    <label style="display:block;font-size:12px;color:#7a7a8e;margin-bottom:6px;">Срок действия в днях (пусто = бессрочно)</label>
                    <input type="number" id="p-validdays" placeholder="30" style="width:100%;padding:12px;background:#0e0e12;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;">
                    
                    <div class="admin-checkbox" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px;background:#0e0e12;border-radius:10px;">
                        <input type="checkbox" id="p-onlynew" style="width:auto;">
                        <label for="p-onlynew" style="font-size:13px;color:#b8b8c8;">🆕 Только для новых</label>
                    </div>
                    
                    <div style="display:flex;gap:8px;">
                        <button class="btn primary" onclick="createPromo()">Создать</button>
                        <button class="btn" onclick="hidePromoForm()">Отмена</button>
                    </div>
                    <div id="promo-result" style="margin-top:12px;font-size:13px;"></div>
                </div>

                <div id="promos-table" class="table-wrap">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
